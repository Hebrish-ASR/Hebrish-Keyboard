# Hebrish revision on top of the HeliBoard version in app/build.gradle.kts. Each APK is
# "<HeliBoard versionName>-hebrish.<revision>" (tag v4.2-hebrish.1), versionCode
# HeliBoard versionCode * 100 + revision. Bump for a Hebrish-only release; the upstream sync
# workflow resets it to 1 when it merges a new HeliBoard release. See docs/upstream.md.
revision=1
